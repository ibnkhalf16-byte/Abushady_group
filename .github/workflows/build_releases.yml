name: Build Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-all:
    name: Unpack Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract Files
        run: |
          python3 -c '
          import os, re, glob
          txt_files = glob.glob("*.txt")
          target_file = None
          for f in txt_files:
              try:
                  with open(f, "r", encoding="utf-8", errors="ignore") as check:
                      data = check.read()
                      if "=== FILE:" in data:
                          target_file = f
                          content = data
                          break
              except Exception:
                  continue
          if not target_file:
              print("No all_code.txt found")
              exit(0)
          parts = re.split(r"=== FILE:\s*(.+?)\s*===", content)
          for i in range(1, len(parts), 2):
              file_path = parts[i].strip()
              file_data = parts[i+1].lstrip("\r\n")
              if file_path.startswith(".github/workflows/"):
                  continue
              dir_name = os.path.dirname(file_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(file_path, "w", encoding="utf-8") as out:
                  out.write(file_data)
          '

      - name: Force bypass login in main.dart
        run: |
          if [ -f "lib/main.dart" ]; then
            sed -i 's/home: const LoginScreen()/home: const MainDashboardScreen()/g' lib/main.dart
            sed -i "s/import 'screens\/auth\/login_screen.dart';/import 'screens\/home\/home_screen.dart';/g" lib/main.dart
          fi

      - name: Commit Extracted Structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto sync and bypass login [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

  build-android:
    name: Build Android APK
    needs: unpack-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Project & Icon
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          fi
          flutter pub get
          if [ -f "assets/images/logo.png" ]; then
            dart run flutter_launcher_icons || true
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Release
    needs: unpack-all
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Windows Project & Icon
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          }
          flutter pub get
          if (Test-Path "assets/images/logo.png") {
            dart run flutter_launcher_icons
          }

      - name: Build Windows Release
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AbuShadyTransport-Windows-x64.zip -Force

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Windows-x64
          path: AbuShadyTransport-Windows-x64.zip
