name: Build Cross-Platform Releases (Android APK & Windows EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    name: Unpack all_code.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Extract Project Files
        run: |
          python3 -c '
          import os, re, glob

          files = glob.glob("*all_code*.txt")
          if not files:
              print("No all_code.txt found")
              exit(0)

          target = files[0]
          print(f"Extracting from: {target}")

          with open(target, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          parts = re.split(r"=== FILE:\s*(.+?)\s*===", content)

          for i in range(1, len(parts), 2):
              file_path = parts[i].strip()
              file_data = parts[i+1].lstrip("\r\n")

              if file_path.startswith(".github/workflows/"):
                  continue

              dir_name = os.path.dirname(file_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)

              with open(file_path, "w", encoding="utf-8") as out:
                  out.write(file_data)
              print(f"Wrote: {file_path}")
          '

      - name: Auto Commit & Push Extracted Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto unpack full project files"
          file_pattern: "lib/** pubspec.yaml AbuShadyApi/** assets/**"

  build-android:
    name: Build Android APK
    needs: unpack-and-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Folder
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          fi

      - name: Build Android Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop Release
    needs: unpack-and-commit
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Folder
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          }

      - name: Build Windows Executable
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AbuShadyTransport-Windows-x64.zip -Force

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Windows-x64
          path: AbuShadyTransport-Windows-x64.zip

