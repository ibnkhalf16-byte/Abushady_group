name: Extract Project Files & Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-all:
    name: Unpack Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Find and Extract Any Master File
        run: |
          python3 -c '
          import os, re, glob

          # البحث في جميع الملفات النصية
          txt_files = glob.glob("*.txt")
          target_file = None

          for f in txt_files:
              try:
                  with open(f, "r", encoding="utf-8", errors="ignore") as check:
                      data = check.read()
                      if "=== FILE:" in data:
                          target_file = f
                          content = data
                          break
              except Exception as e:
                  continue

          if not target_file:
              print("No valid code master text file found containing === FILE: tags!")
              exit(1)

          print(f"Extracting successfully from: {target_file}")

          parts = re.split(r"=== FILE:\s*(.+?)\s*===", content)

          count = 0
          for i in range(1, len(parts), 2):
              file_path = parts[i].strip()
              file_data = parts[i+1].lstrip("\r\n")

              if file_path.startswith(".github/workflows/"):
                  continue

              dir_name = os.path.dirname(file_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)

              with open(file_path, "w", encoding="utf-8") as out:
                  out.write(file_data)
              print(f"Created: {file_path}")
              count += 1

          print(f"SUCCESS: Extracted {count} files.")
          '

      - name: Commit and Push Extracted Structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto unpack full project source code"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes detected to commit."
          fi

  build-android:
    name: Build Android APK
    needs: unpack-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Platform Configs
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          fi

      - name: Build Android Release
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Release
    needs: unpack-all
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows Config
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          }

      - name: Build Windows EXE
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AbuShadyTransport-Windows-x64.zip -Force

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Windows-x64
          path: AbuShadyTransport-Windows-x64.zip
