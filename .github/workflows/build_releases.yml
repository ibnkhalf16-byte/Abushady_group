name: Build Cross-Platform Releases (Android APK & Windows EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # المرحلة 1: استخراج وتوزيع الملفات من all_code.txt عبر Python
  # =========================================================================
  unpack-and-commit:
    name: Unpack all_code.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract Project Files
        run: |
          python3 -c "
          import os, re

          if not os.path.exists('all_code.txt'):
              print('all_code.txt not found, continuing...')
              exit(0)

          with open('all_code.txt', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          parts = re.split(r'=== FILE:\s*(.+?)\s*===', content)

          extracted = 0
          for i in range(1, len(parts), 2):
              file_path = parts[i].strip()
              file_data = parts[i+1].lstrip('\r\n')

              # منع تعديل ملفات الـ workflows لتجنب رفض الصلاحيات من GitHub
              if file_path.startswith('.github/workflows/'):
                  continue

              dir_name = os.path.dirname(file_path)
              if dir_name and not os.path.exists(dir_name):
                  os.makedirs(dir_name, exist_ok=True)

              with open(file_path, 'w', encoding='utf-8') as out:
                  out.write(file_data)
              print(f'Extracted: {file_path}')
              extracted += 1

          print(f'Successfully unpacked {extracted} files.')
          "

      - name: Commit and Push Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ pubspec.yaml AbuShadyApi/ assets/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto extracted all project files [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi

  # =========================================================================
  # المرحلة 2: بناء تطبيق الأندرويد (Android APK)
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: unpack-and-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Folder If Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          fi

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # =========================================================================
  # المرحلة 3: بناء تطبيق الحاسوب (Windows EXE)
  # =========================================================================
  build-windows:
    name: Build Windows Desktop Release
    needs: unpack-and-commit
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Folder If Missing
        run: |
          if (!(Test-Path "windows")) {
            flutter create . --project-name abushady_transport --platforms=android,windows --org com.abushady
          }

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AbuShadyTransport-Windows-x64.zip -Force

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuShadyTransport-Windows-x64
          path: AbuShadyTransport-Windows-x64.zip
